name: Playwright Tests
on:
  push: 
    branches: [main, master]
  pull_request:
      branches: [main, master]

  workflow_dispatch:
    inputs:
      grep:
        description: "Campo opcional para filtrar los tests de playwright"
        required: false
        default: ''
        type: string
      project:
        description: "Proyecto de Playwright contra el que ejecutar las pruebas"
        required: true
        default: 'admin'
        type: choice
        options: 
          - admin
          - employee
      includeEmployee:
        description: "Incluir ejecución de los tests del proyecto 'employee' además de 'admin'"
        required: false
        default: false
        type: boolean
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: |
        PROJECT="${{ github.event.inputs.project || 'admin' }}"
        RUN_EMPLOYEE="${{ github.event.inputs.includeEmployee || 'false' }}"
        GREP="${{ github.event.inputs.grep || '' }}"

        # Determine admin run: use user-provided GREP if present, otherwise run tests tagged @admin
        if [ -n "$GREP" ]; then
          npx playwright test --grep "$GREP" --project=admin
        else
          npx playwright test --grep "@admin" --project=admin
        fi

        # If requested, run tests tagged @ess (ignores project selection and runs on admin project)
        if [ "$RUN_EMPLOYEE" = "true" ]; then
          if [ -n "$GREP" ]; then
            npx playwright test --grep "$GREP" --project=admin
          else
            npx playwright test --grep "@ess" --project=admin
          fi
        fi
      env: 
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        ESS_USERNAME: 'empleado_temporal'
        ESS_PASSWORD: 'password_temporal'
        PROJECT: ${{ github.event.inputs.project || 'admin' }}
        GREP: ${{ github.event.inputs.grep || '' }}
        INCLUDE_EMPLOYEE: ${{ github.event.inputs.includeEmployee || 'false' }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
