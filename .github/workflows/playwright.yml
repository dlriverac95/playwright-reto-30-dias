name: Playwright Tests
on:
  push: 
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      grep:
        description: "Campo opcional para filtrar los tests de playwright"
        required: false
        default: ''
        type: string
      project:
        description: "Proyecto de Playwright contra el que ejecutar las pruebas"
        required: true
        default: 'admin'
        type: choice
        options: 
          - admin
          - employee
      includeEmployee:
        description: "Incluir ejecución de los tests del proyecto 'employee' además de 'admin'"
        required: false
        default: false
        type: boolean

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ESS_USERNAME: 'empleado_temporal'
      ESS_PASSWORD: 'password_temporal'
      
      PROJECT: ${{ inputs.project || 'admin' }}
      GREP_FILTER: ${{ inputs.grep || '' }}
      INCLUDE_EMPLOYEE: ${{ inputs.includeEmployee || 'false' }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: |
        echo "Iniciando tests. Variables: PROJECT=$PROJECT | GREP=$GREP_FILTER | INCLUDE_EMPLOYEE=$INCLUDE_EMPLOYEE"
        
        echo "--- Paso 1: Ejecución del proyecto principal ---"
        if [ -n "$GREP_FILTER" ]; then
          echo "Comando: npx playwright test --grep \"$GREP_FILTER\" --project=\"$PROJECT\""
          npx playwright test --grep "$GREP_FILTER" --project="$PROJECT"
        else
          echo "Comando: npx playwright test --grep \"@$PROJECT\" --project=\"$PROJECT\""
          npx playwright test --grep "@$PROJECT" --project="$PROJECT"
        fi

        if [ "$INCLUDE_EMPLOYEE" = "true" ]; then
          echo "--- Paso 2: Ejecución secundaria (employee) ---"
          if [ -n "$GREP_FILTER" ]; then
            echo "Comando: npx playwright test --grep \"$GREP_FILTER\" --project=employee"
            npx playwright test --grep "$GREP_FILTER" --project=employee
          else
            echo "Comando: npx playwright test --grep \"@ess\" --project=admin"
            npx playwright test --grep "@ess" --project=admin
          fi
        fi

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        